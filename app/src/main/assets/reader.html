<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dbook Reader</title>
    <script src="http://127.0.0.1:8080/jszip.min.js"></script>
    <script src="http://127.0.0.1:8080/epub.min.js"></script>
    <style>
        html, body {
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            overflow: hidden;
            transition: background-color 0.3s;
            -webkit-user-select: text !important;
            user-select: text !important;
            -webkit-touch-callout: none !important;
        }
        #viewer { 
            width: 100vw; 
            height: 100vh; 
            display: block; 
            overflow: hidden !important;
        }

        .no-scroll {
            pointer-events: none !important;
            touch-action: none !important;
        }

        #viewer iframe {
            transition: transform 0.22s ease-out, opacity 0.25s ease-out;
            will-change: transform, opacity;
        }

        .page-slide-next {
            transform: translateX(-30px);
            opacity: 0.3;
        }

        .page-slide-prev {
            transform: translateX(30px);
            opacity: 0.3;
        }

        ::selection {
            background: rgba(33, 150, 243, 0.35) !important;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <script>
        var book = ePub("http://127.0.0.1:8080/book.epub");
        var rendition = book.renderTo("viewer", {
            width: "100%", height: "100%",
            flow: "paginated", spread: "none"
        });

        var urlParams = new URLSearchParams(window.location.search);
        var initialCfi = urlParams.get('cfi');
        var bookIdParam = urlParams.get('bookId') || 'unknown';
        var currentFontSize = 18;
        var isOverviewActive = false;

        var chapterList = [];

        var isDraggingSelection = false;
        var selectionDebounceTimer = null;
        var scrollSnapTimer = null;

        var isSelectingText = false;
        var lockedScrollLeft = 0;

        function getSnappedScrollLeft() {
            try {
                var manager = rendition.manager;
                if (manager && manager.container) {
                    var container = manager.container;
                    var current = container.scrollLeft;
                    
                    var delta = (manager.layout && manager.layout.delta > 0) 
                                ? manager.layout.delta 
                                : container.clientWidth;

                    if (delta > 0) {
                        return Math.round(current / delta) * delta;
                    }
                }
            } catch(e) {
                console.log("[OVERFLOW_DEBUG] getSnappedScrollLeft error:", e);
            }
            return 0;
        }

        function attachContainerScrollWatcher() {
            try {
                var manager = rendition.manager;
                if (!manager || !manager.container) {
                    setTimeout(attachContainerScrollWatcher, 300);
                    return;
                }

                manager.container.addEventListener("scroll", function() {
                    var currentScrollLeft = manager.container.scrollLeft;

                    if (isSelectingText) {
                        if (Math.abs(currentScrollLeft - lockedScrollLeft) > 2) {
                            manager.container.scrollLeft = lockedScrollLeft;
                        }
                        clearTimeout(scrollSnapTimer);
                        return;
                    }

                    clearTimeout(scrollSnapTimer);
                    scrollSnapTimer = setTimeout(function() {
                        snapContainerToPage();
                    }, 150);
                }, { passive: true });
            } catch(e) {
                console.log("[OVERFLOW_DEBUG] attachContainerScrollWatcher error:", e);
            }
        }

        attachContainerScrollWatcher();

        function getLocationsCacheKey() {
            return "epub_location_v2_" + bookIdParam;
        }

        function loadOrGenerateLocations() {
            return new Promise(function(resolve) {
                var cacheKey = getLocationsCacheKey();
                var cached = null;

                try {
                    cached = localStorage.getItem(cacheKey);
                } catch (e) {
                    console.log("Local Storage error:", e);
                }

                if (cached) {
                    try {
                        book.locations.load(cached);
                        if (window.Android && window.Android.onIndexingProgress) {
                            try { window.Android.onIndexingProgress(100); } catch(e) {}
                        }
                        return resolve();
                    } catch (e) {
                        console.log("Failed to load cached locations, regenerating:", e);
                    }
                }

                var isValidCfi = initialCfi && 
                                initialCfi !== "null" && 
                                initialCfi !== "undefined" && 
                                initialCfi !== "" && 
                                initialCfi !== "null%20";

                if (isValidCfi) {
                    if (window.Android && window.Android.onIndexingProgress) {
                        try { window.Android.onIndexingProgress(100); } catch(e) {}
                    }
                    resolve();

                    setTimeout(function() {
                        if (book && book.locations) {
                            book.locations.generate(1600).then(function() {
                                try {
                                    var generated = book.locations.save();
                                    localStorage.setItem(cacheKey, generated);
                                } catch(e) {}
                            }).catch(function(err) {});
                        }
                    }, 1000);
                    return;
                }

                var totalSpineItems = (book.spine && book.spine.spineItems) ? book.spine.spineItems.length : 1;
                var processedItems = 0;

                var originalProcess = (book.locations && book.locations.process) ? book.locations.process.bind(book.locations) : null;
                if (originalProcess) {
                    book.locations.process = function(section) {
                        return originalProcess(section).then(function(result) {
                            processedItems++;
                            var percent = Math.min(99, Math.round((processedItems / totalSpineItems) * 100));
                            if (window.Android && window.Android.onIndexingProgress) {
                                try { window.Android.onIndexingProgress(percent); } catch(e) {}
                            }
                            return result;
                        }).catch(function(err) {
                            return null;
                        });
                    };
                }

                if (window.Android && window.Android.onIndexingProgress) {
                    try { window.Android.onIndexingProgress(0); } catch(e) {}
                }

                book.locations.generate(1600).then(function() {
                    if (originalProcess) book.locations.process = originalProcess;

                    try {
                        var generated = book.locations.save();
                        localStorage.setItem(cacheKey, generated);
                    } catch (e) {
                        console.log("Failed to save locations to cache:", e);
                    }

                    if (window.Android && window.Android.onIndexingProgress) {
                        try { window.Android.onIndexingProgress(100); } catch(e) {}
                    }
                    resolve();
                }).catch(function(err) {
                    if (originalProcess) book.locations.process = originalProcess;
                    if (window.Android && window.Android.onIndexingProgress) {
                        try { window.Android.onIndexingProgress(100); } catch(e) {}
                    }
                    resolve();
                });
            });
        }

        function setTheme(isDark) {
            var bg = isDark ? "#121212" : "#ffffff";
            var text = isDark ? "#e0e0e0" : "#282828";
            document.body.style.backgroundColor = bg;
            
            rendition.themes.default({
                "body": { 
                    "background": bg + " !important", 
                    "color": text + " !important", 
                    "padding": "36px 24px !important"
                },
                "p, div, span, li, a": { 
                    "color": text + " !important"
                },
                "h1, h2, h3, h4, h5, h6": {
                    "color": text + " !important"
                }
            });
        }

        function setReaderTheme(themeMode) {
            var isDark = themeMode === 'dark';
            setTheme(isDark);
        }

        function updateTextFormatting(fontFamily, fontSizePx, lineHeight, textAlign, isDark) {
            currentFontSize = fontSizePx;

            var bg = isDark ? "#121212" : "#ffffff";
            var text = isDark ? "#e0e0e0" : "#282828";

            var selectedFont = (fontFamily === "sans") 
                ? "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important" 
                : "Georgia, Cambria, 'Times New Roman', Times, serif !important";

            document.body.style.backgroundColor = bg;

            rendition.themes.default({
                "body": { 
                    "background": bg + " !important", 
                    "color": text + " !important", 
                    "padding": "36px 24px !important",
                    "font-family": selectedFont
                },
                
                "p:not([class*='title']):not([class*='subtitle']):not([class*='ct']):not([class*='txc']):not([epub\\:type*='title']):not([epub\\:type*='subtitle']):not(:has(img)):not(:has(svg))": { 
                    "color": text + " !important",
                    "font-size": fontSizePx + "px !important",
                    "line-height": lineHeight + " !important",
                    "text-align": textAlign + " !important",
                    "margin-bottom": "1em !important",
                    "font-family": selectedFont
                },
                "li": {
                    "color": text + " !important",
                    "font-size": fontSizePx + "px !important",
                    "line-height": lineHeight + " !important",
                    "font-family": selectedFont
                },
                
                "h1, h2, h3, h4, h5, h6": {
                    "color": text + " !important",
                    "text-align": "center !important",
                    "line-height": "1.3 !important",
                    "margin-top": "0.8em !important",
                    "margin-bottom": "0.6em !important",
                    "font-family": selectedFont
                },
                
                "[epub\\:type*='title'], [epub\\:type*='subtitle'], .subtitle, #subtitle, p.ct, p.txc, .pt": {
                    "color": text + " !important",
                    "text-align": "center !important",
                    "font-family": selectedFont
                },
                
                "img, svg, figure, picture": {
                    "max-width": "100% !important",
                    "height": "auto !important"
                },
                "a, a:link, a:visited, a:hover, a:active": {
                    "color": text + " !important",
                    "text-decoration": "underline"
                }
            });

            setTimeout(function() {
                snapContainerToPage();
            }, 200);
        }

        function setOverviewState(active) {
            isOverviewActive = active;
            var viewer = document.getElementById("viewer");
            if (active) {
                viewer.classList.add("no-scroll");
            } else {
                viewer.classList.remove("no-scroll");
            }
        }

        book.ready.then(function() {
            return loadOrGenerateLocations();
        }).then(function() {
            attachContainerScrollWatcher();
            patchManagerNextTolerance(); 

            chapterList = [];
            
            function parseNavItems(items, parentLabel) {
                if (!items || items.length === 0) return Promise.resolve([]);

                return Promise.all(items.map(function(item) {
                    var labelText = item.label ? item.label.trim() : "";
                    var pct = 0;
                    var page = 1;
                    var hrefTarget = item.href || "";

                    var parts = hrefTarget.split('#');
                    var cleanHref = parts[0];
                    var elementId = parts.length > 1 ? parts[1] : null;

                    var spineSection = book.spine.get(hrefTarget) || book.spine.get(cleanHref);
                    var loadPromise = (spineSection && !spineSection.document) 
                        ? spineSection.load(book.load.bind(book)) 
                        : Promise.resolve();

                    return loadPromise.then(function() {
                        var cfi = null;

                        if (spineSection) {
                            if (elementId && spineSection.document) {
                                var targetEl = spineSection.document.getElementById(elementId) || 
                                            spineSection.document.querySelector('[name="' + elementId + '"]');
                                if (targetEl && spineSection.cfiFromElement) {
                                    cfi = spineSection.cfiFromElement(targetEl);
                                }
                            }
                            if (!cfi && spineSection.cfiFromElement) {
                                cfi = spineSection.cfiFromElement(spineSection.document ? spineSection.document.body : null);
                            }
                        }

                        if (!cfi && book.locations) {
                            cfi = book.locations.cfiFromHref(hrefTarget);
                        }

                        if (cfi) {
                            pct = book.locations.percentageFromCfi(cfi) || 0;
                            var rawPage = book.locations.locationFromCfi(cfi);
                            if (rawPage && rawPage > 0) page = rawPage;
                        } else if (spineSection) {
                            var totalSpine = book.spine.length || 1;
                            var totalLocs = (book.locations && book.locations.total > 0) ? book.locations.total : 100;
                            pct = (spineSection.index / totalSpine);
                            page = Math.max(1, Math.round(pct * totalLocs));
                        }

                        var nodeObj = { 
                            label: labelText, 
                            parentLabel: parentLabel || null,
                            percent: pct, 
                            pageNum: page,
                            href: hrefTarget,
                            subitems: [] 
                        };

                        if (item.subitems && item.subitems.length > 0) {
                            return parseNavItems(item.subitems, labelText).then(function(subResults) {

                                nodeObj.subitems = subResults; 
                                return labelText.length > 0 ? [nodeObj] : subResults;
                            });
                        }
                        
                        return labelText.length > 0 ? [nodeObj] : [];
                    }).catch(function(err) {
                        console.log("TOC item parsing error:", item.label, err);
                        return [];
                    });
                })).then(function(resultsArray) {
                    return [].concat.apply([], resultsArray);
                });
            }

            var parsePromise = (book.navigation && book.navigation.toc) 
                ? parseNavItems(book.navigation.toc, null) 
                : Promise.resolve([]);

            return parsePromise.then(function(finalChapters) {
                chapterList = finalChapters;
                console.log("[DBOOK_DEBUG] Parsed TOC Chapters count:", chapterList.length);

                if (window.Android && window.Android.onChaptersLoaded) {
                    try { window.Android.onChaptersLoaded(JSON.stringify(chapterList)); } catch(e) {}
                }

                var targetToDisplay = (initialCfi && initialCfi !== "null" && initialCfi !== "" && initialCfi !== "undefined") 
                    ? decodeURIComponent(initialCfi) 
                    : undefined;

                return rendition.display(targetToDisplay);
            });
        }).catch(function(err) {
            console.log("Book ready chain error:", err);
            if (window.Android && window.Android.onIndexingProgress) {
                try { window.Android.onIndexingProgress(100); } catch(e) {}
            }
            rendition.display();
        });

        function sendProgress(location) {
            if (window.Android && location && location.start) {
                
                var total = book.locations.total || 1;
                var rawPage = book.locations.locationFromCfi(location.start.cfi);
                var currentPage = (rawPage && rawPage > 0) ? rawPage : 1;
                var percent = book.locations.percentageFromCfi(location.start.cfi) || 0;
                var currentCfi = location.start.cfi;

                var rawHref = location.start.href || "";
                var cleanHref = rawHref.split('#')[0];
                var currentAnchor = rawHref.indexOf('#') !== -1 ? rawHref.split('#')[1] : null;

                var chapterName = "Chapter";

                function flattenChapters(list, parentLabel) {
                    var result = [];
                    for (var i = 0; i < list.length; i++) {
                        var item = list[i];
                        result.push({
                            label: item.label,
                            parentLabel: parentLabel,
                            href: item.href,
                            pageNum: item.pageNum
                        });
                        if (item.subitems && item.subitems.length > 0) {
                            result = result.concat(flattenChapters(item.subitems, item.label));
                        }
                    }
                    return result;
                }

                if (typeof chapterList !== "undefined" && chapterList.length > 0) {
                    var flatList = flattenChapters(chapterList, null);
                    var activeIndex = -1;

                    if (currentAnchor) {
                        for (var i = flatList.length - 1; i >= 0; i--) {
                            var itemHref = flatList[i].href || "";
                            if (itemHref === rawHref || itemHref.endsWith('#' + currentAnchor)) {
                                activeIndex = i;
                                break;
                            }
                        }
                    }

                    if (activeIndex === -1) {
                        var docIndices = [];
                        for (var j = 0; j < flatList.length; j++) {
                            if (flatList[j].href && flatList[j].href.split('#')[0] === cleanHref) {
                                docIndices.push(j);
                            }
                        }

                        if (docIndices.length > 0) {
                            for (var k = docIndices.length - 1; k >= 0; k--) {
                                var idx = docIndices[k];
                                if (flatList[idx].pageNum <= currentPage) {
                                    activeIndex = idx;
                                    break;
                                }
                            }
                            if (activeIndex === -1) activeIndex = docIndices[0];
                        }
                    }

                    if (activeIndex !== -1) {
                        var activeItem = flatList[activeIndex];
                        if (activeItem.parentLabel && activeItem.parentLabel.trim() !== activeItem.label.trim()) {
                            chapterName = activeItem.parentLabel.trim() + ": " + activeItem.label.trim();
                        } else {
                            chapterName = activeItem.label.trim();
                        }
                    }
                }

                if (chapterName === "Chapter") {
                    var navItem = book.navigation.get(rawHref) || book.navigation.get(cleanHref);
                    if (navItem && navItem.label) {
                        chapterName = navItem.label.trim();
                    }
                }

                try { window.Android.updateProgress(currentPage, total, percent, chapterName, currentCfi); } catch(e) {}
            }
        }

        function patchManagerNextTolerance() {
            var manager = rendition.manager;
            if (!manager || typeof manager.next !== "function") {
                setTimeout(patchManagerNextTolerance, 300);
                return;
            }
            if (manager.__nextPatched) return;
            manager.__nextPatched = true;

            var originalNext = manager.next.bind(manager);
            manager.next = function() {
                try {
                    if (this.isPaginated && this.settings.axis === "horizontal" &&
                        (!this.settings.direction || this.settings.direction === "ltr")) {
                        var EPSILON = 2;
                        var wouldFit = this.container.scrollLeft + this.container.offsetWidth + this.layout.delta
                            <= this.container.scrollWidth + EPSILON;
                        if (wouldFit) {
                            this.scrollBy(this.layout.delta, 0, true);
                            return Promise.resolve();
                        }
                    }
                } catch (e) {
                    console.log("[NEXT_PATCH] fallback error:", e);
                }
                return originalNext();
            };
        }

        function safeNext() {
            if (isOverviewActive || isDraggingSelection) return;

            var iframe = document.querySelector("#viewer iframe");
            if (iframe) iframe.classList.add("page-slide-next");

            setTimeout(function() {
                var loc = rendition.currentLocation();
                rendition.next().then(function() {
                    var newLoc = rendition.currentLocation();
                    if (loc && newLoc && loc.start.cfi === newLoc.start.cfi) {
                        var currentIndex = loc.start.index;
                        if (currentIndex < book.spine.length - 1) {
                            var nextSpine = book.spine.get(currentIndex + 1);
                            if (nextSpine) rendition.display(nextSpine.href);
                        }
                    }
                    if (iframe) iframe.classList.remove("page-slide-next");
                }).catch(function() {
                    rendition.next();
                    if (iframe) iframe.classList.remove("page-slide-next");
                });
            }, 100);
        }

        function safePrev() {
            if (isOverviewActive || isDraggingSelection) return;

            var loc = rendition.currentLocation();
            if (!loc || !loc.start) return;

            var currentIndex = loc.start.index;
            if (currentIndex === 0 && loc.atStart) return;

            var iframe = document.querySelector("#viewer iframe");
            if (iframe) iframe.classList.add("page-slide-prev");

            setTimeout(function() {
                rendition.prev().then(function() {
                    var newLoc = rendition.currentLocation();
                    if (newLoc && newLoc.start.cfi === loc.start.cfi) {
                        if (currentIndex > 0) {
                            var prevSpine = book.spine.get(currentIndex - 1);
                            if (prevSpine) {
                                rendition.display(prevSpine.href);
                            }
                        }
                    }
                    if (iframe) iframe.classList.remove("page-slide-prev");
                }).catch(function() {
                    if (currentIndex > 0) {
                        var prevSpine = book.spine.get(currentIndex - 1);
                        if (prevSpine) rendition.display(prevSpine.href);
                    }
                    if (iframe) iframe.classList.remove("page-slide-prev");
                });
            }, 100);
        }

        var touchStartX = 0, touchStartY = 0;
        var touchEndX = 0, touchEndY = 0;
        var initialDistance = 0, isPinching = false;
        var pinchThreshold = 35, swipeThreshold = 40;

        function getDistance(touches) {
            var dx = touches[0].clientX - touches[1].clientX;
            var dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        rendition.hooks.content.register(function(contents) {
            var doc = contents.document;

            try {
                var loc = rendition.currentLocation();
                if (loc && loc.start && loc.start.index === 0) {
                    var currentHref = (loc.start.href || "").toLowerCase();
                    
                    var isTitlePage = currentHref.includes("titlepage") || 
                                      currentHref.includes("title_page"); 

                    if (!isTitlePage) {
                        book.coverUrl().then(function(url) {
                            if (url) {
                                var imgEl = doc.querySelector("img");
                                var svgImageEl = doc.querySelector("svg image");
                                
                                if (imgEl) {
                                    imgEl.src = url;
                                    imgEl.style.setProperty("max-width", "100%", "important");
                                    imgEl.style.setProperty("max-height", "100vh", "important");
                                } else if (svgImageEl) {
                                    svgImageEl.setAttribute("xlink:href", url);
                                    svgImageEl.setAttribute("href", url);
                                }
                            }
                        }).catch(function(e) {
                            console.log("[COVER_FIX] Error getting coverUrl:", e);
                        });
                    }
                }
            } catch(e) {
                console.log("[COVER_FIX] Hook error:", e);
            }

            doc.addEventListener("click", function(e) {
                var target = e.target.closest("a");
                if (target && target.href) {
                    var href = target.getAttribute("href");
                    if (href.startsWith("http://") || href.startsWith("https://")) {
                        e.preventDefault();
                        window.location.href = href;
                    }
                }
            }, true);

            doc.addEventListener("touchstart", function(e) {
                if (e.touches.length === 2) {
                    isPinching = true;
                    initialDistance = getDistance(e.touches);
                } else if (e.touches.length === 1) {
                    isPinching = false;
                    touchStartX = e.touches[0].screenX;
                    touchStartY = e.touches[0].screenY;
                }
            }, {passive: false});

            doc.addEventListener("touchmove", function(e) {
                if (isPinching && e.touches.length === 2 && initialDistance > 0) {
                    var currentDistance = getDistance(e.touches);
                    var deltaDistance = currentDistance - initialDistance;

                    if (deltaDistance < -pinchThreshold) {
                        if (!isOverviewActive) {
                            isOverviewActive = true;
                            if (window.Android && window.Android.openOverview) {
                                try { window.Android.openOverview(); } catch(e) {}
                            }
                        }
                        initialDistance = 0; 
                    } 
                    else if (deltaDistance > pinchThreshold) {
                        if (isOverviewActive) {
                            isOverviewActive = false;
                            if (window.Android && window.Android.closeOverview) {
                                try { window.Android.closeOverview(); } catch(e) {}
                            }
                        }
                        initialDistance = 0;
                    }
                }
            }, {passive: false});

            doc.addEventListener("touchend", function(e) {
                if (!isPinching && e.changedTouches.length === 1) {
                    touchEndX = e.changedTouches[0].screenX;
                    touchEndY = e.changedTouches[0].screenY;
                    handleTapOrSwipe(doc);
                }
                if (e.touches.length < 2) {
                    initialDistance = 0;
                    isPinching = false;
                }
            }, {passive: false});

            setupTextSelectionListener(doc);
        });

        function handleTapOrSwipe(doc) {
            if (isDraggingSelection) return;
            if (doc) {
                var sel = doc.getSelection();
                if (sel && !sel.isCollapsed && sel.toString().trim().length > 0) {
                    return;
                }
            }

            var deltaX = touchEndX - touchStartX;
            var deltaY = touchEndY - touchStartY;
            var screenWidth = window.screen.width || window.innerWidth;

            if (Math.abs(deltaX) < 15 && Math.abs(deltaY) < 15) {
                if (touchEndX >= screenWidth * 0.35 && touchEndX <= screenWidth * 0.65) {
                    if (window.Android && window.Android.toggleOverview) {
                        try { window.Android.toggleOverview(); } catch(e) {}
                    }
                } 
                else if (touchEndX < screenWidth * 0.35) {
                    safePrev();
                } 
                else if (touchEndX > screenWidth * 0.65) {
                    safeNext();
                }
            } 
            else if (Math.abs(deltaX) > swipeThreshold && Math.abs(deltaY) < 100) {
                if (deltaX < 0) {
                    safeNext();
                } else {
                    safePrev();
                }
            }
        }

        function setupTextSelectionListener(doc) {
            if (!doc) return;

            doc.addEventListener("pointerdown", function (e) {
                if (!isSelectingText) {
                    lockedScrollLeft = getSnappedScrollLeft();
                }
                
                var sel = doc.getSelection();
                if (sel && !sel.isCollapsed) {
                    isDraggingSelection = true;
                    isSelectingText = true;
                    if (window.Android && window.Android.onSelectionCleared) {
                        window.Android.onSelectionCleared();
                    }
                }
            }, { passive: true });

            doc.addEventListener("selectionchange", function () {
                var sel = doc.getSelection();

                if (sel && !sel.isCollapsed && sel.toString().trim().length > 0) {
                    if (!isSelectingText) {
                        isSelectingText = true;

                        if (lockedScrollLeft === 0) {
                            lockedScrollLeft = getSnappedScrollLeft();
                        }
                    }
                } else {
                    if (!isDraggingSelection) {
                        isSelectingText = false;
                    }
                }

                if (!sel || sel.isCollapsed || sel.toString().trim().length === 0) {
                    if (window.Android && window.Android.onSelectionCleared) {
                        window.Android.onSelectionCleared();
                    }
                    return;
                }

                if (!isDraggingSelection) {
                    clearTimeout(selectionDebounceTimer);
                    selectionDebounceTimer = setTimeout(function () {
                        processSelectedText(doc);
                    }, 200);
                }
            });

            doc.addEventListener("pointermove", function (e) {
                if (isDraggingSelection) {
                    clearTimeout(selectionDebounceTimer);
                }
            }, { passive: true });

            doc.addEventListener("pointerup", handleSelectionEnd);
            doc.addEventListener("touchend", handleSelectionEnd);

            function handleSelectionEnd() {
                clearTimeout(selectionDebounceTimer);
                selectionDebounceTimer = setTimeout(function () {
                    isDraggingSelection = false;
                    isSelectingText = false;
                    
                    snapContainerToPage();
                    processSelectedText(doc);
                }, 180);
            }
        }

        function snapContainerToPage() {
            try {
                var manager = rendition.manager;
                if (!manager || !manager.container || !manager.layout) return;
                if (isOverviewActive || isSelectingText) return;

                var container = manager.container;
                var delta = manager.layout.delta;
                if (!delta) return;

                var current = container.scrollLeft;
                var snapped = Math.round(current / delta) * delta;

                if (Math.abs(current - snapped) > 2) {
                    container.scrollLeft = snapped;
                }
            } catch(e) {
                console.log("[OVERFLOW_DEBUG] snap error:", e);
            }
        }

        function processSelectedText(doc) {
            var sel = doc.getSelection();
            if (!sel || sel.isCollapsed) return;

            var selectedText = sel.toString().trim();
            if (selectedText.length === 0) return;

            try {
                var range = sel.getRangeAt(0);
                var rects = range.getClientRects();
                
                var firstRect = rects.length > 0 ? rects[0] : range.getBoundingClientRect();
                var lastRect = rects.length > 0 ? rects[rects.length - 1] : range.getBoundingClientRect();

                var iframe = document.querySelector("#viewer iframe");
                var iframeRect = iframe ? iframe.getBoundingClientRect() : { left: 0, top: 0 };

                var posX = iframeRect.left + firstRect.left;
                var topY = iframeRect.top + firstRect.top;
                var bottomY = iframeRect.top + lastRect.bottom;

                var cfi = "";
                var contentsList = rendition.getContents();
                if (contentsList && contentsList.length > 0) {
                    var matchedContents = contentsList.find(function(c) {
                        return c.document === doc;
                    }) || contentsList[0];

                    cfi = matchedContents.cfiFromRange(range);
                }

                if (window.Android && window.Android.onTextSelectedWithPosition && cfi) {
                    window.Android.onTextSelectedWithPosition(cfi, selectedText, posX, topY, bottomY);
                }
            } catch (e) {
                console.error("Error processing text selection:", e);
            }
        }

        function searchInBook(query) {
            if (!query) return;

            var searchPromises = book.spine.spineItems.map(function(item) {
                return item.load(book.load.bind(book)).then(function() {
                    var results = item.find(query) || [];
                    
                    var chapterName = "Chapter";
                    try {
                        var cleanHref = item.href ? item.href.split('#')[0] : "";
                        var navItem = book.navigation.get(item.href) || book.navigation.get(cleanHref);
                        if (navItem && navItem.label) {
                            chapterName = navItem.label.trim();
                        }
                    } catch(e) {}

                    var fullChapterText = "";
                    if (item.document && item.document.body) {
                        var docClone = item.document.body.cloneNode(true);
                        var headersAndTitles = docClone.querySelectorAll('h1, h2, h3, h4, h5, h6, .chapter-title, .title, header');
                        headersAndTitles.forEach(function(headerEl) { headerEl.remove(); });
                        fullChapterText = (docClone.textContent || "").replace(/\s+/g, ' ').trim();
                    }

                    var lastSearchIdx = 0;

                    var formatted = results.map(function(res) {
                        var pageNum = 1;
                        try {
                            var rawPage = book.locations.locationFromCfi(res.cfi);
                            if (rawPage && rawPage > 0) {
                                pageNum = Math.max(1, rawPage - 1);
                            }
                        } catch(e) {}

                        var richExcerpt = "";

                        if (fullChapterText) {
                            var lowerFull = fullChapterText.toLowerCase();
                            var lowerQuery = query.trim().toLowerCase();

                            var matchIdx = lowerFull.indexOf(lowerQuery, lastSearchIdx);

                            if (matchIdx !== -1) {
                                var padding = 110; 

                                var rawStart = Math.max(0, matchIdx - padding);
                                var start = rawStart;

                                if (lastSearchIdx > 0 && lastSearchIdx < matchIdx) {
                                    var periodAfterPrevious = lowerFull.indexOf('.', lastSearchIdx);
                                    if (periodAfterPrevious !== -1 && periodAfterPrevious < matchIdx && periodAfterPrevious > rawStart) {
                                        start = periodAfterPrevious + 1;
                                    } else {
                                        start = Math.max(lastSearchIdx, rawStart);
                                    }
                                } else if (rawStart > 0) {
                                    var spaceIdx = fullChapterText.indexOf(' ', rawStart);
                                    start = (spaceIdx !== -1 && spaceIdx < matchIdx) ? spaceIdx + 1 : rawStart;
                                }

                                lastSearchIdx = matchIdx + lowerQuery.length;

                                var rawEnd = Math.min(fullChapterText.length, matchIdx + lowerQuery.length + padding);
                                var end = rawEnd;

                                var nextMatchIdx = lowerFull.indexOf(lowerQuery, lastSearchIdx);

                                if (nextMatchIdx !== -1 && nextMatchIdx < rawEnd) {
                                    var periodBeforeNext = lowerFull.lastIndexOf('.', nextMatchIdx);
                                    if (periodBeforeNext !== -1 && periodBeforeNext > matchIdx) {
                                        end = periodBeforeNext + 1;
                                    } else {
                                        end = nextMatchIdx;
                                    }
                                } else if (rawEnd < fullChapterText.length) {
                                    var periodAfterMatch = fullChapterText.indexOf('.', matchIdx + lowerQuery.length);
                                    if (periodAfterMatch !== -1 && periodAfterMatch <= rawEnd) {
                                        end = periodAfterMatch + 1;
                                    } else {
                                        var spaceIdx = fullChapterText.lastIndexOf(' ', rawEnd);
                                        end = (spaceIdx !== -1 && spaceIdx > matchIdx + lowerQuery.length) ? spaceIdx : rawEnd;
                                    }
                                }

                                richExcerpt = fullChapterText.substring(start, end).trim();

                                if (start > 0) richExcerpt = '...' + richExcerpt;
                                if (end < fullChapterText.length && !richExcerpt.endsWith('.')) {
                                    richExcerpt = richExcerpt + '...';
                                }
                            }
                        }

                        if (!richExcerpt) {
                            richExcerpt = res.excerpt ? res.excerpt.trim() : query;
                        }

                        return {
                            cfi: res.cfi,
                            excerpt: richExcerpt,
                            chapter: chapterName,
                            page: pageNum
                        };
                    });

                    item.unload();
                    return formatted;
                }).catch(function(err) {
                    console.error("Error loading spine item for search:", err);
                    return [];
                });
            });

            Promise.all(searchPromises).then(function(resultsArray) {
                var flatResults = [].concat.apply([], resultsArray);

                if (window.Android && window.Android.onSearchResultsLoaded) {
                    window.Android.onSearchResultsLoaded(JSON.stringify(flatResults));
                }
            }).catch(function(err) {
                console.error("Search Promise.all error:", err);
                if (window.Android && window.Android.onSearchResultsLoaded) {
                    window.Android.onSearchResultsLoaded(JSON.stringify([]));
                }
            });
        }

        function goToPercent(percent) {
            var cfi = book.locations.cfiFromPercentage(percent);
            rendition.display(cfi);
        }

        var isBookRendered = false;
        var pendingHrefToJump = null;

        rendition.started.then(function() {
            isBookRendered = true;
            if (pendingHrefToJump) {
                console.log("[DBOOK_JS] Processing pending jump href:", pendingHrefToJump);
                var target = pendingHrefToJump;
                pendingHrefToJump = null;
                executeChapterJump(target);
            }
        });

        function goToChapterHref(href) {
            if (!href) return;

            if (isOverviewActive) {
                setOverviewState(false);
                if (window.Android && window.Android.closeOverview) {
                    try { window.Android.closeOverview(); } catch(e) {}
                }
            }

            if (!isBookRendered) {
                console.log("[DBOOK_JS] ePub belum selesai render awal, mengantrikan href:", href);
                pendingHrefToJump = href;
                return;
            }

            executeChapterJump(href);
        }

        function executeChapterJump(href) {
            try {
                if (!href) return;

                var parts = href.split('#');
                var cleanHref = parts[0];
                var elementId = parts.length > 1 ? parts[1] : null;

                var spineSection = book.spine.get(href) || book.spine.get(cleanHref);

                if (spineSection) {
                    var loadPromise = spineSection.document 
                        ? Promise.resolve() 
                        : spineSection.load(book.load.bind(book));

                    loadPromise.then(function() {
                        var cfi = null;

                        if (elementId && spineSection.document) {
                            var targetEl = spineSection.document.getElementById(elementId) || 
                                        spineSection.document.querySelector('[name="' + elementId + '"]');
                            if (targetEl && spineSection.cfiFromElement) {
                                cfi = spineSection.cfiFromElement(targetEl);
                            }
                        }

                        if (cfi) {
                            console.log("[DBOOK_JS] Lompat ke sub-chapter via CFI:", cfi);
                            return rendition.display(cfi);
                        }

                        console.log("[DBOOK_JS] Lompat via href biasa:", href);
                        return rendition.display(href);
                    }).catch(function(err) {
                        console.log("[DBOOK_JS] Error load section, fallback display href:", err);
                        rendition.display(href);
                    });
                } else {
                    rendition.display(href);
                }
            } catch(e) {
                console.log("executeChapterJump error:", e);
                rendition.display(href);
            }
        }

        function applyHighlight(cfi, colorHex) {
            try {
                rendition.annotations.highlight(cfi, {}, function(e) {}, "highlight-" + Date.now(), {
                    "fill": colorHex,
                    "fill-opacity": "0.35",
                    "mix-blend-mode": "multiply"
                });
            } catch (err) {
                console.error("[HIGHLIGHT_DEBUG] Highlight failed:", err);
            }
            var iframe = document.querySelector("iframe");
            if (iframe && iframe.contentDocument) {
                iframe.contentDocument.getSelection().removeAllRanges();
            }
        }

        function loadAnnotations(annotationsJson) {
            try {
                var list = JSON.parse(annotationsJson);
                list.forEach(function(item) {
                    rendition.annotations.highlight(item.cfi, {}, function(e) {}, "hl-" + item.id, {
                        "fill": item.colorHex,
                        "fill-opacity": "0.35",
                        "mix-blend-mode": "multiply"
                    });
                });
            } catch(e) { console.error(e); }
        }

        var searchHighlightCfi = null;
        var isNavigatingToSearch = false;

        function goToSearchResult(cfi, searchText) {
            if (!cfi) return;

            isNavigatingToSearch = true;

            rendition.display(cfi).then(function() {
                setTimeout(function() {
                    clearSearchHighlight();
                    applySearchHighlight(cfi);

                    if (searchText) {
                        highlightSpecificCfiText(cfi, searchText);
                    }

                    isNavigatingToSearch = false;
                }, 200);
            }).catch(function(err) {
                console.error("Error displaying search CFI:", err);
                isNavigatingToSearch = false;
            });
        }

        function applySearchHighlight(cfi) {
            clearSearchHighlight();
            searchHighlightCfi = cfi;
            
            try {
                rendition.annotations.highlight(cfi, {}, function(e) {}, "search-temp-hl", {
                    "fill": "#FFEB3B",
                    "fill-opacity": "0.6",
                    "mix-blend-mode": "multiply"
                });
            } catch(e) {
                console.error("Failed to apply search highlight via annotation:", e);
            }
        }

        function resetIframeScroll() {
            try {
                var iframe = document.querySelector("#viewer iframe");
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.scrollTo(0, 0);
                }
            } catch(e) {}
        }

        function highlightSpecificCfiText(cfi, searchText) {
            try {
                var iframe = document.querySelector("#viewer iframe");
                if (!iframe || !iframe.contentDocument) return;

                var doc = iframe.contentDocument;

                var targetElement = null;
                try {
                    var range = rendition.getRange(cfi);
                    if (range && range.startContainer) {
                        targetElement = range.startContainer.nodeType === Node.TEXT_NODE 
                            ? range.startContainer.parentNode 
                            : range.startContainer;
                    }
                } catch(err) {
                    console.log("getRange failed, fallback to body search:", err);
                }

                if (!targetElement) {
                    targetElement = doc.body;
                }

                if (!searchText || searchText.trim().length === 0) return;

                var cleanQuery = searchText.trim();
                var regex = new RegExp("(" + escapeRegExp(cleanQuery) + ")", "gi");

                var walker = doc.createTreeWalker(targetElement, NodeFilter.SHOW_TEXT, null, false);
                var nodesToReplace = [];

                while (walker.nextNode()) {
                    var node = walker.currentNode;
                    if (node.parentNode && 
                        node.parentNode.nodeName !== "SCRIPT" && 
                        node.parentNode.nodeName !== "STYLE" &&
                        node.parentNode.nodeName !== "MARK" &&
                        node.nodeValue.match(regex)) {
                        nodesToReplace.push(node);
                    }
                }

                if (nodesToReplace.length > 0) {
                    var node = nodesToReplace[0];
                    var parent = node.parentNode;
                    var val = node.nodeValue;
                    var fragment = doc.createDocumentFragment();
                    var lastIndex = 0;

                    var matchFound = false;
                    val.replace(regex, function(match, p1, offset) {
                        if (matchFound) return;

                        if (offset > lastIndex) {
                            fragment.appendChild(doc.createTextNode(val.substring(lastIndex, offset)));
                        }

                        var mark = doc.createElement("mark");
                        mark.className = "search-dom-highlight";
                        mark.style.backgroundColor = "#FFEB3B";
                        mark.style.color = "#000000";
                        mark.style.borderRadius = "2px";
                        mark.style.padding = "2px 0";
                        mark.appendChild(doc.createTextNode(match));
                        fragment.appendChild(mark);

                        lastIndex = offset + match.length;
                        matchFound = true;
                    });

                    if (lastIndex < val.length) {
                        fragment.appendChild(doc.createTextNode(val.substring(lastIndex)));
                    }

                    if (matchFound) {
                        parent.replaceChild(fragment, node);
                    }
                }

            } catch (e) {
                console.error("DOM specific highlight error:", e);
            }
        }

        function triggerShareAsImage() {
            var iframe = document.querySelector("#viewer iframe");
            if (!iframe || !iframe.contentDocument) return;

            var sel = iframe.contentDocument.getSelection();
            if (sel && !sel.isCollapsed && sel.toString().trim().length > 0) {
                var selectedText = sel.toString().trim();
                var bookTitle = (book.package && book.package.metadata) ? book.package.metadata.title : "Unknown Title";
                var bookAuthor = (book.package && book.package.metadata) ? book.package.metadata.creator : "Unknown Author";

                if (window.Android && window.Android.openQuoteShareDialog) {
                    window.Android.openQuoteShareDialog(selectedText, bookTitle, bookAuthor);
                }
            }
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function clearDomHighlights(doc) {
            try {
                if (!doc) {
                    var iframe = document.querySelector("#viewer iframe");
                    if (iframe) doc = iframe.contentDocument;
                }
                if (doc) {
                    var marks = doc.querySelectorAll("mark.search-dom-highlight");
                    marks.forEach(function(m) {
                        var parent = m.parentNode;
                        while (m.firstChild) parent.insertBefore(m.firstChild, m);
                        parent.removeChild(m);
                        if (parent) parent.normalize();
                    });
                }
            } catch(e) {}
        }

        function clearSearchHighlight() {
            if (searchHighlightCfi) {
                try {
                    rendition.annotations.remove(searchHighlightCfi, "highlight");
                    rendition.annotations.remove("search-temp-hl", "highlight");
                } catch(e) {}
                searchHighlightCfi = null;
            }
            clearDomHighlights();
        }

        rendition.on("relocated", function(location) {
            sendProgress(location);
            
            if (!isNavigatingToSearch) {
                clearSearchHighlight();
            }
        });
    </script>
</body>
